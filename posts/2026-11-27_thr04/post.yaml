    A fun trick for your next trip.

    Take a photo of old ruins. Then ask ChatGPT or another AI: "Show me how this place looked when it was new." It adds the missing walls, roofs and people right on your photo.

    Your holiday pictures become a time machine.

    Shops and old buildings can use this too: the past and the present side by side. Want a story like this for your place? Message us. mela.team

